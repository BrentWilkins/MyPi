---
# Playbook 4: MAME
# Teaches: simple single-package playbook, tags

- name: Install MAME
  hosts: all
  become: true

  tasks:
    - name: Install MAME
      ansible.builtin.apt:
        name: mame
        state: present
      tags:
        - mame

    - name: Symlink mame into PATH for ES-DE discovery
      ansible.builtin.file:
        src: /usr/games/mame
        dest: /usr/local/bin/mame
        state: link
      tags:
        - mame
