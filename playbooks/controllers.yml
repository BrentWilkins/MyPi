---
# Playbook: controllers.yml — SDL controller mappings and Bluetooth tweaks
# Separated from kiosk.yml so controller config can change independently

- name: Configure game controllers
  hosts: all
  become: true

  tasks:
    - name: Blacklist hid_nintendo (clone controllers fail its probe)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-hid-nintendo.conf
        mode: "0644"
        content: "blacklist hid_nintendo\n"

    - name: Allow HID connections from non-bonded controllers
      ansible.builtin.lineinfile:
        path: /etc/bluetooth/input.conf
        regexp: "^#?ClassicBondedOnly="
        line: "ClassicBondedOnly=false"
      notify: Restart bluetooth

    - name: Pin stable per-port symlinks for the two DragonRise sticks
      ansible.builtin.copy:
        src: ../templates/99-dragonrise-sticks.rules
        dest: /etc/udev/rules.d/99-dragonrise-sticks.rules
        mode: "0644"
      notify: Reload udev

    # Same file kiosk.yml deploys — keep both on the template so a tag-scoped
    # `--tags controllers` run can't silently drop the DragonRise SDL mapping
    # (without it ES-DE reports "no gamepads").
    - name: Install SDL controller mappings
      ansible.builtin.copy:
        src: ../templates/sdl-controllers.env
        dest: /home/{{ ansible_user }}/.config/sdl-controllers.env
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    # Both DragonRise sticks are now wired with buttons, so this can no longer be a
    # fixed slot pin (that broke whenever only one stick was plugged in: forcing
    # Player 1 to slot 1 left it with no device when slot 1 didn't exist). Leave
    # player→joypad index at RetroArch's default (auto-assign in connection order)
    # so a single connected stick always becomes Player 1, and reconnecting after
    # unplugging just works. Player order is therefore decided by physical USB
    # port (libudev syspath sort): port 1-2 sorts before port 3-2, so the stick in
    # port 1-2 is Player 1. See templates/99-dragonrise-sticks.rules.
    - name: Clear any static RetroArch player→joypad index pins
      ansible.builtin.lineinfile:
        path: /home/{{ ansible_user }}/.config/retroarch/retroarch.cfg
        regexp: '^{{ item }}\s*='
        state: absent
      loop:
        - input_player1_joypad_index
        - input_player2_joypad_index

    # These global binds only ever covered player 1, and their layout (a=0, b=1,
    # x=2, y=3, hat d-pad) contradicted the per-device autoconfig below (y=0, x=1,
    # l=2, b=3, a=4, r=5, axis lever). Whenever autoconfig didn't load they gave
    # player 1 a different layout and a dead lever while player 2 went unbound —
    # exactly the "the two sticks aren't mapped the same" symptom. The autoconfig
    # matches on vendor/product id, so it covers both sticks in every slot; this
    # block is redundant. Remove it from any host that already has it.
    - name: Remove legacy player-1-only RetroArch controller bindings
      ansible.builtin.blockinfile:
        path: /home/{{ ansible_user }}/.config/retroarch/retroarch.cfg
        marker: "# {mark} ANSIBLE MANAGED — controller bindings"
        state: absent

    # Per-device autoconfig for the DragonRise sticks — the single source of truth
    # for their button layout. Matched by USB vendor/product id (the SDL GUID is
    # zero) rather than by player slot, so it applies to BOTH identical sticks in
    # whichever pad slot each lands. Fixes the lever (analog axes, not a hat) so it
    # drives the D-pad in every core, and lays down the 6-button SNES layout that
    # the per-core remaps build on.
    - name: Create RetroArch udev autoconfig directory
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.config/retroarch/autoconfig/udev
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Deploy DragonRise autoconfig profile
      ansible.builtin.copy:
        src: ../templates/retroarch-dragonrise-autoconfig.cfg
        dest: /home/{{ ansible_user }}/.config/retroarch/autoconfig/udev/DragonRise.cfg
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    # Per-core remap: NES uses only B/A, so collapse the six buttons onto them.
    - name: Create RetroArch NES remap directory
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.config/retroarch/config/remaps/Nestopia
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Deploy NES (Nestopia) input remap
      ansible.builtin.copy:
        src: ../templates/retroarch-nes.rmp
        dest: /home/{{ ansible_user }}/.config/retroarch/config/remaps/Nestopia/Nestopia.rmp
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

  handlers:
    - name: Restart bluetooth
      ansible.builtin.systemd:
        name: bluetooth
        state: restarted

    - name: Reload udev
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - udevadm control --reload
        - udevadm trigger --subsystem-match=input
