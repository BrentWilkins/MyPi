---
# Playbook: controllers.yml — SDL controller mappings and Bluetooth tweaks
# Separated from kiosk.yml so controller config can change independently

- name: Configure game controllers
  hosts: all
  become: true

  tasks:
    - name: Blacklist hid_nintendo (clone controllers fail its probe)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-hid-nintendo.conf
        mode: "0644"
        content: "blacklist hid_nintendo\n"

    - name: Allow HID connections from non-bonded controllers
      ansible.builtin.lineinfile:
        path: /etc/bluetooth/input.conf
        regexp: "^#?ClassicBondedOnly="
        line: "ClassicBondedOnly=false"
      notify: Restart bluetooth

    - name: Pin stable per-port symlinks for the two DragonRise sticks
      ansible.builtin.copy:
        src: ../templates/99-dragonrise-sticks.rules
        dest: /etc/udev/rules.d/99-dragonrise-sticks.rules
        mode: "0644"
      notify: Reload udev

    - name: Install SDL controller mappings
      ansible.builtin.copy:
        dest: /home/{{ ansible_user }}/.config/sdl-controllers.env
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        content: |
          # Fosmon Pro Controller clone (paired via Home+Y, handled by hid-generic)
          # Physical→evtest: A=btn0, B=btn1, X=btn2, Y=btn3, L=btn4, R=btn5, ZL=btn6, ZR=btn7, -=btn8, +=btn9, Home=btn10
          export SDL_GAMECONTROLLERCONFIG="030000007e0500090200000001000000,Pro Controller,a:b0,b:b1,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,back:b8,start:b9,guide:b10,leftstick:b11,rightstick:b12,leftx:a0,lefty:a1,rightx:a2,righty:a3,dpup:h0.1,dpdown:h0.4,dpleft:h0.8,dpright:h0.2,"

    # The working stick is on port 3-2, which RetroArch's udev driver places in pad
    # slot 1 (libudev sorts the buttonless port 1-2 stick into slot 0). Point Player 1
    # at slot 1 so the working stick drives P1 in-game; P2 gets the other slot.
    - name: Pin RetroArch player→joypad indices (working stick = Player 1)
      ansible.builtin.lineinfile:
        path: /home/{{ ansible_user }}/.config/retroarch/retroarch.cfg
        regexp: '^{{ item.key }}\s*='
        line: '{{ item.key }} = "{{ item.value }}"'
      loop:
        - { key: input_player1_joypad_index, value: "1" }
        - { key: input_player2_joypad_index, value: "0" }

    - name: Set RetroArch controller bindings
      ansible.builtin.blockinfile:
        path: /home/{{ ansible_user }}/.config/retroarch/retroarch.cfg
        marker: "# {mark} ANSIBLE MANAGED — controller bindings"
        block: |
          input_player1_a_btn = "0"
          input_player1_b_btn = "1"
          input_player1_x_btn = "2"
          input_player1_y_btn = "3"
          input_player1_l_btn = "4"
          input_player1_r_btn = "5"
          input_player1_l2_btn = "6"
          input_player1_r2_btn = "7"
          input_player1_select_btn = "8"
          input_player1_start_btn = "9"
          input_player1_up_btn = "h0up"
          input_player1_down_btn = "h0down"
          input_player1_left_btn = "h0left"
          input_player1_right_btn = "h0right"
          input_player1_l3_btn = "11"
          input_player1_r3_btn = "12"
          input_player1_l_x_plus_axis = "+0"
          input_player1_l_x_minus_axis = "-0"
          input_player1_l_y_plus_axis = "+1"
          input_player1_l_y_minus_axis = "-1"
          input_player1_r_x_plus_axis = "+2"
          input_player1_r_x_minus_axis = "-2"
          input_player1_r_y_plus_axis = "+3"
          input_player1_r_y_minus_axis = "-3"
          input_enable_hotkey_btn = "8"
          input_exit_emulator_btn = "9"

    # Per-device autoconfig for the DragonRise stick. Matched by USB vendor/product
    # id (the SDL GUID is zero), this fixes the lever (analog axes, not a hat) so it
    # drives the D-pad in every core, and lays down the 6-button SNES layout that the
    # per-core remaps build on. Takes precedence over the generic binds above when
    # the stick connects.
    - name: Create RetroArch udev autoconfig directory
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.config/retroarch/autoconfig/udev
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Deploy DragonRise autoconfig profile
      ansible.builtin.copy:
        src: ../templates/retroarch-dragonrise-autoconfig.cfg
        dest: /home/{{ ansible_user }}/.config/retroarch/autoconfig/udev/DragonRise.cfg
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    # Per-core remap: NES uses only B/A, so collapse the six buttons onto them.
    - name: Create RetroArch NES remap directory
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.config/retroarch/config/remaps/Nestopia
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Deploy NES (Nestopia) input remap
      ansible.builtin.copy:
        src: ../templates/retroarch-nes.rmp
        dest: /home/{{ ansible_user }}/.config/retroarch/config/remaps/Nestopia/Nestopia.rmp
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

  handlers:
    - name: Restart bluetooth
      ansible.builtin.systemd:
        name: bluetooth
        state: restarted

    - name: Reload udev
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - udevadm control --reload
        - udevadm trigger --subsystem-match=input
