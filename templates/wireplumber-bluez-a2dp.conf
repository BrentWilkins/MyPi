# WirePlumber drop-in — high-quality A2DP for the Bluetooth headset.
# Deployed by playbooks/audio.yml to
#   ~/.config/wireplumber/wireplumber.conf.d/51-bluez-a2dp.conf
#
# The headset is for game audio only (no mic), so we offer ONLY the A2DP roles.
# That stops WirePlumber from ever switching the device into the low-quality
# HFP/HSP "headset" profile, and means a reconnect always comes back as a
# proper high-quality audio sink.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq      = true
  bluez5.enable-msbc        = true
  bluez5.enable-hw-volume   = true
  bluez5.roles              = [ a2dp_sink a2dp_source ]
  bluez5.autoswitch-profile = false
}
