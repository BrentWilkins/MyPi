# RetroArch autoconfig profile — homemade DragonRise USB arcade encoder.
#
# Deployed to ~/.config/retroarch/autoconfig/udev/DragonRise.cfg (see controllers.yml).
# The stick reports a zero SDL GUID, but RetroArch's udev joypad driver matches on
# the USB vendor/product id (0079:0006), so this profile binds reliably.
#
# Physical layout (two rows of three) -> standard SNES / Street-Fighter 6-button:
#     top:    Y(b0)  X(b1)  L(b2)
#     bottom: B(b3)  A(b4)  R(b5)
# Per-core tweaks (e.g. NES collapsing to 2 buttons) layer on top via remaps/.
input_driver = "udev"
input_device = "DragonRise Inc.   Generic   USB  Joystick  "
input_vendor_id = "121"
input_product_id = "6"

input_y_btn = "0"
input_x_btn = "1"
input_l_btn = "2"
input_b_btn = "3"
input_a_btn = "4"
input_r_btn = "5"

# Coin (Select) + Start, and the Select+Start exit combo matching the MAME baseline.
input_select_btn = "8"
input_start_btn = "9"
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"

# The lever is reported as analog axes (a0 = X, a1 = Y), NOT a hat. Bind it to both
# the D-pad (menus + digital cores: NES/SNES) and the left analog stick (N64 movement).
input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
