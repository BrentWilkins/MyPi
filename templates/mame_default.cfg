<?xml version="1.0"?>
<!-- Global MAME input defaults for the kiosk fight stick (DragonRise encoder).
     Deployed to ~/.mame/cfg/default.cfg; applies to every arcade game.
       Coin 1  = stick 1 button 9  (wired to the encoder's SELECT pin)
       Start 1 = stick 1 button 10 (wired to the encoder's START pin)
       Coin 2  = stick 2 button 9   } same pins on the second identical stick, so
       Start 2 = stick 2 button 10  } player 2 can coin up without the keyboard
       Exit    = Esc, OR holding SELECT + START together (button 9 + button 10)
     Note: MAME rewrites this file on exit, so in-game remaps persist until the
     next playbook run re-applies this baseline. -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="COIN1">
                <newseq type="standard">JOYCODE_1_BUTTON9</newseq>
            </port>
            <port type="START1">
                <newseq type="standard">JOYCODE_1_BUTTON10</newseq>
            </port>
            <port type="COIN2">
                <newseq type="standard">JOYCODE_2_BUTTON9</newseq>
            </port>
            <port type="START2">
                <newseq type="standard">JOYCODE_2_BUTTON10</newseq>
            </port>
            <port type="UI_CANCEL">
                <newseq type="standard">KEYCODE_ESC OR JOYCODE_1_BUTTON9 JOYCODE_1_BUTTON10</newseq>
            </port>
        </input>
    </system>
</mameconfig>
